<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言区 - HDU-Lolita爱好站</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>留言区</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="sales.html">贩售信息</a>
            <a href="message.html" class="active">留言区</a>
        </nav>
    </header>

    <main>
        <h2 style="text-align:center; margin:20px 0;">欢迎留下你的意见或分享穿搭心得 ✨</h2>

        <form id="messageForm" novalidate>
            <label>昵称：
                <input type="text" name="username" required placeholder="请输入你的昵称">
                    <div class="field-error" data-for="username"></div>
            </label><br><br>

            <label>邮箱：
                <input type="email" name="email" placeholder="可选填写">
                    <div class="field-error" data-for="email"></div>
            </label><br><br>

            <label>主题：
                <select name="topic">
                    <div class="field-error" data-for="topic"></div>
                    <option value="suggestion">网站建议</option>
                    <option value="share">穿搭分享</option>
                    <option value="other">其他</option>
                </select>
            </label><br><br>

            <label>留言内容：</label><br>
            <textarea name="message" rows="5" cols="50" placeholder="请输入留言内容..." required></textarea>
                    <div class="field-error" data-for="message"></div><br><br>

            <label>
                <input type="checkbox" required> 我已阅读并同意隐私政策
            </label><br><br>

            <button type="submit">提交留言</button>
        </form>

    </main>

    <!-- 页脚 -->
    <footer>
        <p>© 2025 HDU-Lolita爱好站 | 邮箱：hdu-lolita@xx.edu.cn</p>
    </footer>


<script>
(function(){
  const form = document.getElementById('messageForm');
  if(!form) return;

  const alertBox = document.getElementById('formAlert');

  const fields = {
    username: form.querySelector('[name="username"]'),
    email: form.querySelector('[name="email"]'),
    topic: form.querySelector('[name="topic"]'),
    message: form.querySelector('[name="message"]'),
    privacy: form.querySelector('input[type="checkbox"]')
  };

  const rules = {
    username: (v) => {
      const s = (v || '').trim();
      if(!s) return '请输入昵称。';
      if(s.length < 2) return '昵称至少 2 个字符。';
      if(s.length > 16) return '昵称最多 16 个字符。';
      // 可选：限制特殊字符
      if(!/^[\u4e00-\u9fa5A-Za-z0-9_·\-\s]+$/.test(s)) return '昵称仅支持中文/英文/数字/下划线/短横线。';
      return '';
    },
    email: (v) => {
      const s = (v || '').trim();
      if(!s) return ''; // 可选项
      // 轻量邮箱校验（不追求 100% RFC）
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) return '邮箱格式不正确。';
      if(s.length > 60) return '邮箱太长了。';
      return '';
    },
    topic: (v) => {
      const s = (v || '').trim();
      if(!s) return '请选择主题。';
      return '';
    },
    message: (v) => {
      const s = (v || '').trim();
      if(!s) return '请输入留言内容。';
      if(s.length < 8) return '留言内容至少 8 个字符。';
      if(s.length > 300) return '留言内容最多 300 个字符。';
      return '';
    },
    privacy: (checked) => checked ? '' : '请勾选同意隐私政策。'
  };

  function errEl(key){
    return form.querySelector('.field-error[data-for="'+key+'"]');
  }
  function setError(key, msg){
    const el = errEl(key);
    if(!el) return;
    el.textContent = msg || '';
    el.style.display = msg ? 'block' : 'none';
    // 给输入框加错误态
    const input = fields[key];
    if(input && input.classList){
      input.classList.toggle('input--error', !!msg);
    }
  }

  function setAlert(msg, type){
    if(!alertBox) return;
    alertBox.textContent = msg || '';
    alertBox.className = 'form-alert' + (type ? (' form-alert--'+type) : '');
    alertBox.style.display = msg ? 'block' : 'none';
  }

  function validateOne(key){
    if(key === 'privacy'){
      const msg = rules.privacy(!!fields.privacy.checked);
      setError('privacy', msg);
      return !msg;
    }
    const input = fields[key];
    const msg = rules[key](input ? input.value : '');
    setError(key, msg);
    return !msg;
  }

  function validateAll(){
    const keys = Object.keys(rules);
    let ok = true;
    keys.forEach(k => { if(!validateOne(k)) ok = false; });
    return ok;
  }

  // 实时校验
  ['input','blur','change'].forEach(evt => {
    form.addEventListener(evt, (e) => {
      const t = e.target;
      if(!t || !t.name) return;
      if(rules[t.name]) validateOne(t.name);
    }, true);
  });

  if(fields.privacy){
    fields.privacy.addEventListener('change', () => validateOne('privacy'));
  }

  form.addEventListener('submit', (e) => {
    setAlert('', '');
    const ok = validateAll();
    if(!ok){
      e.preventDefault();
      setAlert('还有内容需要完善：请检查红色提示项。', 'error');
      // 滚动到第一个错误
      const first = form.querySelector('.input--error') || form.querySelector('.field-error[style*="block"]');
      if(first && first.scrollIntoView) first.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }

    // 静态站演示：阻止真正提交，并给出成功提示
    e.preventDefault();
    setAlert('提交成功（演示）：你的留言已通过客户端校验。', 'success');

    // 可选：把留言暂存到 localStorage
    try{
      const payload = {
        username: (fields.username.value||'').trim(),
        email: (fields.email.value||'').trim(),
        topic: (fields.topic.value||'').trim(),
        message: (fields.message.value||'').trim(),
        time: new Date().toISOString()
      };
      localStorage.setItem('demo_last_message', JSON.stringify(payload));
    }catch(_){}

    // 清空表单
    form.reset();
    ['username','email','topic','message','privacy'].forEach(k => setError(k,''));
  });
})();
</script>

</body>
</html>
