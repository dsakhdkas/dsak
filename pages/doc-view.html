<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档查看 - HDU-Lolita爱好站</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="header">
    <div class="logo"><i class="fa-solid fa-ribbon"></i> HDU-Lolita爱好站</div>
    <nav>
        <ul>
            <li><a href="../index.html">首页</a></li>
            <li><a href="about.html">关于Lolita</a></li>
            <li><a href="sales.html">贩售信息</a></li>
            <li><a href="message.html">留言区</a></li>
            <li><a href="readme.html">README</a></li>
            <li><span id="authSlot"></span></li>
        </ul>
    </nav>
</header>

<section class="page-hero">
    <div class="page-hero__inner">
        <h1><i class="fa-solid fa-book"></i> 项目文档查看</h1>
        <p id="docDesc">查看 doc 目录下的 HTML / CSS / JS / 计划说明文档</p>
    </div>
</section>

<main class="container">
    <section class="panel">
        <h2 class="panel__title" style="margin-top:0;">
            <i class="fa-solid fa-file-lines"></i> 文档内容
        </h2>
        <p class="muted">当前页面会根据 URL 参数 <code>?file=</code> 动态加载对应 Markdown 文件并进行渲染。</p>
        <div id="docContent" style="background:#faf7fb; padding:16px; border-radius:8px; border:1px solid rgba(0,0,0,0.05); max-height:70vh; overflow:auto; font-size:14px; line-height:1.7;"></div>
    </section>
</main>

<footer>
    <p>© 2025 HDU-Lolita爱好站 | <i class="fa-solid fa-envelope"></i> 邮箱：hdu-lolita@xx.edu.cn</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="../js/readme.js"></script>
<script>
  (function(){
    var sp = new URLSearchParams(location.search);
    var file = sp.get("file") || "doc/html.md";

    // 安全起见，只允许访问 doc/ 目录下的特定文件
    var allow = [
      "doc/html.md",
      "doc/css.md",
      "doc/js.md",
      "doc/plan.md"
    ];

    if(allow.indexOf(file) === -1){
      file = "doc/html.md";
    }

    var titleMap = {
      "doc/html.md": "HTML 技术说明",
      "doc/css.md": "CSS 技术说明",
      "doc/js.md": "JavaScript 技术说明",
      "doc/plan.md": "开发计划 / 任务规划"
    };

    var h1 = document.querySelector(".page-hero h1");
    if(h1 && titleMap[file]){
      h1.innerHTML = '<i class="fa-solid fa-book"></i> ' + titleMap[file];
    }

    var desc = document.getElementById("docDesc");
    if(desc){
      desc.textContent = "当前文档：" + (titleMap[file] || file);
    }

    var contentEl = document.getElementById("docContent");
    if(window.loadMarkdownInto){
      window.loadMarkdownInto(contentEl, "../" + file);
    }
  })();
</script>
<script src="../js/auth.js"></script>
</body>
</html>
